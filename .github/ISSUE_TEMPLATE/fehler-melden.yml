name: Fehler melden
description: Eine Angabe ist falsch oder veraltet, oder eine ERP-Lösung fehlt.
title: "Fehler: "
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Am hilfreichsten ist ein Link auf die Quelle (Produktseite, Preisliste, Zertifikat, Dokumentation).
        Bitte keine vertraulichen Informationen eintragen – Meldungen sind öffentlich.
  - type: input
    id: loesung
    attributes:
      label: Lösung
      description: Name oder ID der Lösung (steht in der Adresse, z.B. bexio-bexio). Leer lassen, wenn eine Lösung fehlt.
  - type: textarea
    id: fehler
    attributes:
      label: Was ist falsch oder fehlt?
      description: Welche Angabe stimmt nicht (z.B. Modul «Lager», Preis, Swissdec), und wie lautet sie richtig?
    validations:
      required: true
  - type: input
    id: quelle
    attributes:
      label: Quelle
      description: Link, der die Korrektur belegt.
  - type: dropdown
    id: absender
    attributes:
      label: Sie sind …
      options:
        - Nutzerin / Nutzer
        - Anbieter der Lösung
        - Partner / Treuhand
        - Andere
